
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | BookSpace</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div class="page-container">

    <header class="topbar">
        <div>
            <p class="section-eyebrow">BOOKSPACE / ADMIN</p>
            <h1 class="page-title">Admin Dashboard</h1>
            <p class="subtitle">
                Manage users and oversee your library
            </p>
        </div>

        <div class="topbar-right">
            <span class="user-badge">
                ✦ <strong sec:authentication="name">admin</strong>
            </span>

            <form th:action="@{/logout}" method="post">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">
                <button class="btn btn-danger" type="submit">
                    Logout
                </button>
            </form>
        </div>
    </header>

    <div class="dashboard-grid">
        <div class="stat-card">
            <span class="stat-icon">👥</span>
            <span class="stat-label">Total Users</span>
            <strong class="stat-value"
                    th:text="${#lists.size(users)}">0</strong>
        </div>

        <div class="stat-card">
            <span class="stat-icon">🛡️</span>
            <span class="stat-label">Access Level</span>
            <strong class="stat-value">ADMIN</strong>
        </div>

        <div class="stat-card">
            <span class="stat-icon">📚</span>
            <span class="stat-label">Library</span>
            <a th:href="@{/templates/books}"
               class="btn btn-primary">
                Open Catalogue
            </a>
        </div>
    </div>

    <section class="card">
        <div class="card-header">
            <div>
                <p class="section-eyebrow">USER MANAGEMENT</p>
                <h2>Registered Users</h2>
            </div>
        </div>

        <div class="table-wrapper">
            <table class="books-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Roles</th>
                    <th>Status</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}"></td>
                    <td>
                        <strong th:text="${user.username}"></strong>
                    </td>
                    <td>
                        <span class="role-pill"
                              th:each="role : ${user.roles}"
                              th:text="${role}">
                            USER
                        </span>
                    </td>
                    <td>
                        <span class="status-pill"
                              th:classappend="${user.enabled}
                                  ? 'status-active'
                                  : 'status-disabled'"
                              th:text="${user.enabled}
                                  ? 'Active'
                                  : 'Disabled'">
                        </span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <a th:href="@{/templates/books}" class="back-link">
        ← Back to Book Catalogue
    </a>

</div>

</body>
</html>
